name: Build Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  dsp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: skellyruno/skell-vst-template
          ref: 4c05e29cb0d8b30bf25a0aa857c0c71e86f2da87
          path: _skellcore
      - name: DSP tests (original Studio)
        run: |
          g++ -O2 -std=c++17 -I Source tests/dsp_test.cpp -o dsp_test
          ./dsp_test
      - name: Live path + intrinsic-latency regression
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Wpedantic -I _skellcore/SkellCore/include tests/live_dsp_test.cpp -o live_dsp_test
          ./live_dsp_test
  build:
    runs-on: windows-latest
    needs: dsp-tests
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Package
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Directory -Recurse -Filter '*.vst3' | Select-Object -First 1
          if (-not $plugin) { throw 'VST3 bundle missing' }
          Compress-Archive -Path $plugin.FullName -DestinationPath skell-spacer-vst-Windows-VST3.zip
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: skell-spacer-vst-Windows-VST3
          path: skell-spacer-vst-Windows-VST3.zip
          if-no-files-found: error
