name: Build Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  dsp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DSP tests
        run: |
          g++ -O2 -std=c++17 -I Source tests/dsp_test.cpp -o dsp_test
          ./dsp_test
  build:
    runs-on: windows-latest
    needs: dsp-tests
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Package
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Directory -Recurse -Filter '*.vst3' | Select-Object -First 1
          if (-not $plugin) { throw 'VST3 bundle missing' }
          Compress-Archive -Path $plugin.FullName -DestinationPath skell-spacer-vst-Windows-VST3.zip
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: skell-spacer-vst-Windows-VST3
          path: skell-spacer-vst-Windows-VST3.zip
          if-no-files-found: error
