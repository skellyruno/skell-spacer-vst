          if (-not $exe) { throw 'Compiled JUCE UI audit executable missing' }
          New-Item -ItemType Directory -Force -Path ui-audit | Out-Null
          & $exe.FullName ui-audit
          if ($LASTEXITCODE -ne 0) { throw "Real editor UI audit failed ($LASTEXITCODE)" }
          $stress = Get-ChildItem -Path build -Recurse -File -Filter 'SkellSpacerUIStress.exe' | Select-Object -First 1
          if (-not $stress) { throw 'Compiled JUCE editor stress executable missing' }
          & $stress.FullName
          if ($LASTEXITCODE -ne 0) { throw "Real editor stress test failed ($LASTEXITCODE)" }
          $screens = @(Get-ChildItem ui-audit -Filter '*.png')
          if ($screens.Count -lt 15) { throw "Expected 15+ actual editor screenshots; got $($screens.Count)" }
      - uses: actions/upload-artifact@v4
